name: Haskell CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # run at start of every day
    - cron: '0 0 * * *'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        ghc: ['9.10']
        os: [ubuntu-26.04]

    name: ${{ matrix.os }} GHC ${{ matrix.ghc }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup Haskell
      uses: haskell-actions/setup@v2
      id: setup
      with:
        ghc-version: ${{ matrix.ghc }}

    - name: Build
      run: |
        cabal build
        cabal test
        cabal haddock
